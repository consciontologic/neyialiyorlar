# Redis configuration for neyialiyorlar cache tier
# Phase 4: caching topology for sub-millisecond hot reads

# Memory management
# Prevents Redis from consuming unbounded host RAM
maxmemory 256mb

# Eviction policy: LRU on memory pressure
# Safe for the cache tier because derived data is also in Postgres
# (metric_value table is the source of truth)
maxmemory-policy allkeys-lru

# Persistence
# AOF (Append-Only File) persists keys across dev restart
# IMPORTANT: AOF does NOT persist pub/sub!
# Pub/sub is fire-and-forget; event durability rests on Postgres +
# the scheduled-fallback recompute (Phase 3 Analytic Core).
# If at-least-once delivery is ever required, upgrade to Redis Streams.
appendonly yes
appendfsync everysec

# Keyspace notifications for cache-miss telemetry
# Ex = keyevent notifications only (not keyspace)
# Enables subscriptions to __keyevent@0__:expired for future telemetry
notify-keyspace-events Ex

# Database selection (default: db 0)
databases 1

# Port configuration (default: 6379)
port 6379
bind 0.0.0.0

# TCP backlog
tcp-backlog 511

# TCP keepalive
tcp-keepalive 300

# Timeout for idle clients (0 = disabled)
timeout 0

# Logging
loglevel notice
databases 1
