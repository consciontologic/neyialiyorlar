    <style>
      /* Reset & text-selection fix for all browsers */
      *, *::before, *::after { box-sizing: border-box; }
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        /* Allow native text selection everywhere */
        -webkit-user-select: text;
        -moz-user-select: text;
        -ms-user-select: text;
        user-select: text;
        /* Prevent tap highlight flash on mobile */
        -webkit-tap-highlight-color: transparent;
        /* Smooth font rendering */
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      /* Prevent 300ms tap delay on all browsers */
      body { touch-action: manipulation; }
      /* Loading splash — dark bg to avoid white flash */
      body { background-color: #0d1117; }
      /* Remove outline on Flutter canvas (keyboard navigation handled inside Flutter) */
      flt-glass-pane { outline: none !important; }
    </style>
    <script>
      var serviceWorkerVersion = null;
      var scriptLoaded = false;
      function loadMainDartJs() {
        if (scriptLoaded) return;
        scriptLoaded = true;
        var scriptTag = document.createElement('script');
        scriptTag.src = 'main.dart.js';
        scriptTag.type = 'application/javascript';
        document.body.append(scriptTag);
      }
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('service_worker.js').then(function(reg) {
          function waitForActivation(sw) {
            sw.addEventListener('statechange', function() {
              if (sw.state === 'activated') loadMainDartJs();
            });
          }
          if (!reg.active && (reg.installing || reg.waiting)) {
            waitForActivation(reg.installing || reg.waiting);
          } else {
            loadMainDartJs();
          }
        }).catch(function() { loadMainDartJs(); });
      } else {
        window.addEventListener('load', loadMainDartJs);
      }
    </script>
  </head>
  <body>
    <script>window.flutterPlatformChannelReady = function() {};</script>
  </body>
