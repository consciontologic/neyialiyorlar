name: neyialiyorlar
description: Financial metrics PWA dashboard for BIST market analysis

publish_to: 'none'

version: 0.1.0

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: 3.22.0

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.0
  riverpod_annotation: ^2.3.0

  # HTTP and WebSocket
  dio: ^5.4.0
  web_socket_channel: ^3.0.0

  # Serialization
  json_serializable: ^6.7.0
  json_annotation: ^4.9.0

  # UI components
  intl: ^0.19.0

  # Local persistence (watchlist)
  shared_preferences: ^2.2.0

  # Storage (offline cache)
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Navigation
  go_router: ^13.0.0

  # Testing
  http: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code generation
  build_runner: ^2.4.0
  riverpod_generator: ^2.3.0

  # Golden tests
  golden_toolkit: ^0.13.0

  # Linting
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # Assets for offline mode
  assets:
    - assets/
